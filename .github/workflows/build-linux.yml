# Linux 构建（ccbot_headless）。
#
# 两个目的：
#   ① 可移植性门禁 —— 第三个编译器（GCC）。v3.9.0 那次就是 MSVC 放行、Clang 拒绝；
#      GCC 又有自己的严格之处，多一个编译器就多一层保险
#   ② 产出预编译的 Linux 二进制 —— headless 要跑在 VPS 上，而此前只能自己 clone 编，
#      需要在服务器上装 vcpkg、编一堆依赖，门槛不低
#
# GUI 在 Linux 不构建（CMakeLists 是 `if(WIN32 OR APPLE)`），这里只编 headless
# 与全部测试。vcpkg.json 把 Qt 标了 platform:windows，所以 Linux 上不会去装 Qt。
name: build-linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_TAG: '2026.07.29'

jobs:
  build:
    runs-on: ubuntu-latest
    # 兜底：GitHub 默认允许一个 job 跑 6 小时。首次编依赖（缓存未命中）约 30 分钟，
    # 90 分钟足够宽松；卡住的任务不该白烧六小时才被发现
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # apt 在 GitHub runner 上会偶发【挂死】（不是报错，是卡住不动）——v3.9.1 和
      # v3.9.3 两次发版都撞上，每次都要人工取消重跑。
      # 重试循环单独用不管用：挂死的进程不会退出，循环根本轮不到下一次。所以用
      # timeout 主动砍掉，再由外层循环重试；job 级 timeout-minutes 是最后兜底，
      # 免得卡住的任务白烧六小时
      - name: Install build tools
        timeout-minutes: 15
        run: |
          set -e
          ok=0
          for i in 1 2 3; do
            if timeout 240 sudo apt-get update -qq && \
               timeout 480 sudo apt-get install -y ninja-build pkg-config \
                            autoconf autoconf-archive automake libtool; then
              ok=1; break
            fi
            echo "── apt 第 $i 次超时或失败，15 秒后重试 ──"
            sudo killall apt-get dpkg 2>/dev/null || true
            sudo dpkg --configure -a || true
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "apt 三次均失败"; exit 1; }

      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build
        run: cmake --build build

      - name: Save vcpkg binary cache (even on failure)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vcpkg-failure-logs-linux
          path: |
            build/vcpkg-manifest-install.log
            ${{ runner.temp }}/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      - name: Run all test suites
        run: |
          set -e
          for t in ccg_indicator_tests ccg_key_store_tests ccg_risk_tests \
                   ccg_funding_tests ccg_rate_tests ccg_order_tests \
                   ccg_stress_tests ccg_liq_tests \
                   ccg_persist_tests ccg_config_tests ccg_price_tests ccg_timesync_tests; do
            echo "── $t ──"
            ./build/$t
          done

      - name: Package
        run: |
          set -e
          mkdir -p pkg
          cp build/ccbot_headless build/ladder_depth pkg/
          cp config.example.json pkg/
          chmod +x pkg/ccbot_headless pkg/ladder_depth

      # 泄漏检查同样是硬门禁。config.example.json 是模板（不含真凭证），但白名单
      # 只放行可执行文件，所以要在检查【之后】再放进 zip
      - name: Leak check (hard gate)
        run: |
          rm -f pkg/config.example.json
          VER=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF#refs/tags/}"; fi
          if [ -n "$VER" ]; then
            python3 tools/leak_check.py pkg --expect-version "$VER" --exe ccbot_headless
          else
            python3 tools/leak_check.py pkg
          fi
          cp config.example.json pkg/

      - name: Zip
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          cd pkg && zip -r "../ccbot-$VER-linux-x64.zip" . && cd ..
          ls -la ccbot-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ccbot-linux-x64
          path: ccbot-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ccbot-linux-x64
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: ccbot-*.zip
          fail_on_unmatched_files: true
