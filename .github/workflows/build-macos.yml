# 云端构建 macOS 版（Apple Silicon + Intel 双架构）：手动触发 或 推送 v* 标签时自动跑。
# 产物：ccbot-<版本>-macos-arm64.zip / -x64.zip（各含 GUI + headless 两个可执行文件），
# 标签构建会自动附加到对应的 GitHub Release。
# 注意：产物未做 Apple 签名/公证，下载后需要:
#   chmod +x CCGMonitor ccbot_headless && xattr -dr com.apple.quarantine .
name: build-macos

on:
  push:
    branches: [main]              # 推 main 就跑：不要等到发布那一刻才发现编不过
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 默认只读。挂载 Release 需要写权限，但只给那一步（见 job 级 permissions）——
# 权限范围越窄，一旦某个 Action 被投毒能造成的破坏越小
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64            # Apple Silicon（M系列）
            runner: macos-latest
            triplet: arm64-osx
          - arch: x64              # Intel Mac
            runner: macos-15-intel
            triplet: x64-osx
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write          # 仅为最后一步的 Release 挂载
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install build tools
        # autoconf 系列是 libb2（qtbase 依赖）的构建要求，runner 没预装
        run: brew install ninja pkg-config autoconf autoconf-archive automake libtool

      - name: Set up vcpkg
        run: |
          git clone --depth 1 --branch 2026.07.29 https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      # vcpkg 编译好的依赖包缓存（第一次跑 Qt 要几十分钟，之后命中缓存只要几分钟）。
      # 用 restore+save 拆开而不是 actions/cache：失败的构建也要把已编译好的包存下来，
      # 否则每次调试失败都要从零重编所有依赖
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-osx-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-osx-${{ matrix.arch }}-

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build build

      - name: Save vcpkg binary cache (even on failure)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-osx-${{ matrix.arch }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      # 依赖编译失败时把 vcpkg 的详细日志传出来，否则只能看到 BUILD_FAILED 一个词
      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vcpkg-failure-logs-${{ matrix.arch }}
          path: |
            build/vcpkg-manifest-install.log
            /Users/runner/vcpkg/buildtrees/*/*.log
          if-no-files-found: ignore

      # 全部测试套件。此前只跑指标那一套，风控闸门/资金费/限流/订单路径/凭证存储
      # 五套都没跑过——测试写了却没人守着
      - name: Run all test suites
        run: |
          set -e
          for t in ccg_indicator_tests ccg_key_store_tests ccg_risk_tests \
                   ccg_funding_tests ccg_rate_tests ccg_order_tests \
                   ccg_stress_tests ccg_liq_tests \
                   ccg_persist_tests ccg_config_tests ccg_price_tests ccg_timesync_tests; do
            echo "── $t ──"
            ./build/$t
          done

      - name: Package
        run: |
          mkdir -p pkg
          cp build/CCGMonitor build/ccbot_headless build/ladder_depth pkg/

      # 硬门禁：白名单校验 + 内嵌版本号核对。mac 包此前完全没有这一步
      - name: Leak check (hard gate)
        run: |
          VER=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF#refs/tags/}"; fi
          if [ -n "$VER" ]; then
            python3 tools/leak_check.py pkg --expect-version "$VER" --exe CCGMonitor
          else
            python3 tools/leak_check.py pkg
          fi

      # 包名带版本号，与 Windows/Linux 两条对齐。此前 mac 包叫 ccbot-macos-arm64.zip，
      # 下载到本地就分不清是哪一版了——Release 页面上三个包应该是同一套命名
      - name: Zip
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VER="dev-${GITHUB_SHA::7}"
          cd pkg && zip -r "../ccbot-$VER-macos-${{ matrix.arch }}.zip" . && cd ..
          ls -la ccbot-*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ccbot-macos-${{ matrix.arch }}
          path: ccbot-*-macos-${{ matrix.arch }}.zip

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: ccbot-*-macos-${{ matrix.arch }}.zip
          fail_on_unmatched_files: true
